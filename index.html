<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Courtside Parlays</title>
<meta name="description" content="NBA, NFL, MLB, tennis and esports parlay builder with live odds, a prop finder, injuries and automatic bet tracking.">
<meta name="theme-color" content="#07090f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parlays">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12.5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M3.5 16h25M16 3.5v25M7.5 7.5c4.5 4 4.5 13 0 17M24.5 7.5c-4.5 4-4.5 13 0 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span>
    <span>Courtside</span>
  </div>
  <div class="day" role="group" aria-label="Choose day">
    <button id="prevDay" aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="dayLabel" aria-label="Back to today">Today</button>
    <button id="nextDay" aria-label="Next day"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</header>
<nav class="sports" aria-label="Sport">
  <button data-sport="nba">NBA</button><button data-sport="nfl">NFL</button><button data-sport="mlb">MLB</button><button data-sport="tennis">Tennis</button><button data-sport="esports">Esports</button>
</nav>
<div id="offline" class="offline" hidden>You're offline. Showing the last data loaded.</div>

<main id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="games" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M6 5.5c3 3 3 10 0 13M18 5.5c-3 3-3 10 0 13"/></svg><span>Games</span></button>
  <button data-tab="finder"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M8 12.5v-2M10.5 12.5v-4M13 12.5v-3"/></svg><span>Finder</span></button>
  <button data-tab="props"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Props</span></button>
  <button data-tab="slip"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>Slip</span><b id="slipCount" class="badge" hidden>0</b></button>
  <button data-tab="tracker"><svg viewBox="0 0 24 24"><path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/></svg><span>Tracker</span></button>
</nav>

<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
